<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Details Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
  margin:0;
  background:#0f0f0f;
  font-family:Arial,sans-serif;
  color:#fff;
}

/* Main Image */
.main-image-wrapper{
  width:100%;
  padding-top:15px;
  display:flex;
  justify-content:center;
}

.main-image{
  width:92%;
  max-height:280px;
  object-fit:cover;
  border-radius:12px 12px 0px 0px;
}

/* Info Card */
.info-card{
  width:92%;
  box-sizing:border-box;
  background:#111;
  margin:0 auto 14px;
  padding:18px;
  border:1px solid #333;
  text-align:center;
}

/* Name */
.info-card h2{
  margin:5px 0 18px;
  font-size:20px;
  color:#fff;
}

/* Line by line text */
.info-card p{
  margin:10px 0;
  font-size:17px;
  color:#ddd;
  line-height:1.6;
}

/* Highlight Box */
.stats{
  margin-top:18px;
  font-size:18px;
  color:#fff;
}

.stats span{
  display:inline-block;
  background:#fff;
  color:#000;
  padding:4px 12px;
  border-radius:20px;
  margin:0 8px;
  font-weight:bold;
}

</style>
</head>

<body>

<!-- Main Image -->
<div class="main-image-wrapper">
  <img id="mainImage" class="main-image" src="" alt="">
</div>

<!-- ID Card -->
<div class="info-card">

  <h2 id="name">Loading...</h2>

  <p>
    <strong>পদবি:</strong>
    <span id="rank"></span>
  </p>

  <p>
    <strong>ঠিকানা:</strong>
    <span id="address"></span>
  </p>

  <p>
    <strong>কর্মরত:</strong>
    <span id="working"></span>
  </p>

  <p>
    <strong>মোবাইল নাম্বার:</strong>
    <span id="phone"></span>
  </p>

  <div class="stats">
    বই:
    <span id="book"></span>

    কোরআন:
    <span id="quran"></span>
  </div>

</div>

<script>

const API_URL = "https://sheetdb.io/api/v1/nek9ge34jycxv";

/* URL থেকে ID নেওয়া */
const params = new URLSearchParams(window.location.search);
const movieId = params.get("id");

/* Data Fetch */
fetch(API_URL)
.then(res => res.json())
.then(data => {

  const movie = data.find(item => item.id === movieId);

  if(!movie) return;

  /* Main Image */
  document.getElementById("mainImage").src = movie.image;

  /* Info */
  document.getElementById("name").innerText = movie.name;

  document.getElementById("rank").innerText = movie.Rank;

  document.getElementById("address").innerText = movie.address;

  document.getElementById("working").innerText = movie.Working;

  document.getElementById("phone").innerText = movie.phone;

  document.getElementById("book").innerText = movie.book;

  document.getElementById("quran").innerText = movie.quran;

});

</script>

</body>
</html>
