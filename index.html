<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  font-family:Arial,sans-serif;
}

/* Loading Screen */
#loader{
  position:fixed;
  inset:0;
  background:#000;
  color:#d6d6d6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  letter-spacing:1px;
  z-index:99999;
}

/* Header */
.header{
  text-align:center;
  padding:12px 8px;
  background:#003366;
  color:#fff;
}

.header h1{
  font-size:18px;
  margin:0 0 6px;
  font-weight:bold;
}

.header p{
  margin:2px 0;
  font-size:12px;
}

/* Scrolling Text */
.scroll-text{
  width:100%;
  overflow:hidden;
  background:#000;
  padding:2px 0;
}

.scroll-text p{
  display:inline-block;
  white-space:nowrap;
  color:#00ffcc;
  font-size:15px;
  font-weight:bold;
  margin:0;
  line-height:1.2;
  padding-left:100%;
  animation:scrollLeft 30s linear infinite;
}

/* Animation */
@keyframes scrollLeft{

  0%{
    transform:translateX(0%);
  }

  100%{
    transform:translateX(-200%);
  }

}

/* Gallery */
.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
  padding:6px;
}

/* Card */
.card{
  position:relative;
  width:100%;
  aspect-ratio:1 / 1.4;
  border-radius:6px;
  overflow:hidden;
  background:#111;
}

/* Image */
.card-img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* Click Area */
.card a{
  position:absolute;
  inset:0;
}

/* Title */
.card span{
  position:absolute;
  bottom:0;
  width:100%;
  background:linear-gradient(to top, rgba(0,0,0,.8), transparent);
  color:#fff;
  font-size:12px;
  font-weight:bold;
  padding:8px;
  text-align:center;
}

/* Floating Button */
.chat-button{
  position:fixed;
  right:20px;
  bottom:20px;
  width:55px;
  height:55px;
  background:#00aa88;
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  z-index:9999;
  -webkit-tap-highlight-color: transparent;
  outline:none;
}

/* Popup */
.popup-box{
  position:fixed;
  right:20px;
  bottom:85px;
  width:320px;
  background:#111;
  color:#fff;
  padding:15px;
  border-radius:12px;
  border:2px solid #444;
  display:none;
  z-index:9999;
}

.popup-box h3{
  margin-top:0;
  font-size:20px;
}

.popup-box p{
  font-size:15px;
  line-height:1.6;
}

</style>
</head>

<body>

<!-- Loading -->
<div id="loader">
  <i>
    রোকোজারা...
  </i>
</div>

<!-- Header -->
<div class="header">

  <h1>
    সহিহ পদ্ধতিতে কুরআন শিক্ষা ফাউন্ডেশন।
  </h1>

  <p>
    গণপ্রজাতন্ত্রী বাংলাদেশ সরকার কর্তৃক অনুমোদিত, রেজি নং ১৯৭০৮
  </p>

</div>

<!-- Scrolling Text -->
<div class="scroll-text">

  <p>
    একটি বিশেষ বিজ্ঞপ্তি: ৫-১-২০২৬ থেকে শুরু হওয়া বই এবং কুরআন প্রতিযোগিতা, এবং এক নজরে সমস্ত আপডেট জানতে চোখ রাখুন এই অ্যাপসে।
  </p>

</div>

<!-- Gallery -->
<div class="gallery" id="gallery"></div>

<!-- Floating Button -->
<div class="chat-button" onclick="togglePopup(event)">
  💬
</div>

<!-- Popup -->
<div class="popup-box" id="popupBox">

  <h3>নোটিশ</h3>

  <p>
    আসসালামু আলাইকুম ওয়া রাহমাতুল্লাহ।
  </p>

</div>

<script>

/* API */
const API_URL = "https://sheetdb.io/api/v1/6g14o3v06mhoa";

/* Gallery Load */
fetch(API_URL)

.then(res => res.json())

.then(data => {

  const gallery = document.getElementById("gallery");

  data.forEach(item => {

    gallery.innerHTML += `

      <div class="card">

        <img 
          src="${item.image}" 
          class="card-img"
          onload="hideLoader()"
        >

        <a href="page.html?id=${item.id}"></a>

        <span>${item.title}</span>

      </div>

    `;

  });

})

.catch(error => {

  console.log(error);

  hideLoader();

});

/* Hide Loader */
function hideLoader(){

  document.getElementById("loader").style.display = "none";

}

/* Popup Toggle */
function togglePopup(event){

  event.stopPropagation();

  const popup = document.getElementById("popupBox");

  if(popup.style.display === "block"){

    popup.style.display = "none";

  }else{

    popup.style.display = "block";

  }

}

/* Click Anywhere Close Popup */
document.addEventListener("click", function(){

  document.getElementById("popupBox").style.display = "none";

});

</script>

</body>
</html>
